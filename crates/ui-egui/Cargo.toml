[package]
name = "open3d-launcher-ui-egui"
description = "Open3D Launcher's egui interface, shared by the desktop and web builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The workspace's lints, except that `unsafe` is denied rather than forbidden: `open3d_settings.rs`,
# the language shared by the Open3D apps, asks Windows for its language, and allows that one call by
# name with its reason.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
open3d-launcher-core = { workspace = true }
egui = { workspace = true }
craft-ui = { workspace = true }
egui_extras = { workspace = true, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
# The shared `settings.json` (`open3d_settings.rs`).
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Finding the Simplified Chinese face in a system font collection; egui already uses it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# The system time zone, so dates read as this computer's calendar; already in the desktop build.
jiff = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's time zone, for the same dates.
js-sys = "0.3"
wasm-bindgen = "0.2"

[dev-dependencies]
# egui 0.37 no longer bundles its fallback faces by default; these tests install them
# explicitly. Production also inherits `default_fonts` from eframe and the workspace's
# `monochrome_emoji_fonts` feature.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
